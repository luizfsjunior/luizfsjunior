name: Calendário 3D

on:
  schedule:
    - cron: "0 9 * * *" # todo dia, 6h de Brasília
  push:
    branches: [main]
    paths-ignore: ["profile-3d-contrib/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit e push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Calendário 3D atualizado"; then
            git push
          fi
