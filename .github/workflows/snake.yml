name: Snake

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#e9d5ff,#c4b5fd,#a78bfa,#7c3aed
            dist/snake-dark.svg?palette=github-dark&color_snake=#f0abfc&color_dots=#161b22,#2e1d55,#5b3a99,#8b5cf6,#c4b5fd

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
